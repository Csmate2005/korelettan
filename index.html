<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A vér élettana - 100 Kérdéses Adatbázis & ZH Mód</title>
    <style>
        :root {
            --primary: #8b0000;
            --primary-light: #ff4d4d;
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-card: #252525;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --correct: #2e7d32;
            --incorrect: #c62828;
            --border: #333333;
            --accent: #d32f2f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-light);
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        select, button.zh-btn {
            background-color: var(--surface-card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button.zh-btn {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
        }

        button.zh-btn:hover {
            background-color: var(--primary-light);
        }

        .category-group {
            margin-bottom: 40px;
        }

        .category-title {
            background-color: var(--primary);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .q-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .q-number {
            font-weight: bold;
            color: var(--primary-light);
            margin-right: 10px;
        }

        .q-text {
            font-size: 1.05rem;
            font-weight: 500;
            flex-grow: 1;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .opt-btn {
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .opt-btn:hover {
            background-color: #303030;
            border-color: #555;
        }

        .opt-btn.selected {
            border-color: var(--primary-light);
            background-color: #382020;
        }

        .opt-btn.correct {
            background-color: var(--correct) !important;
            color: white;
            border-color: var(--correct);
        }

        .opt-btn.incorrect {
            background-color: var(--incorrect) !important;
            color: white;
            border-color: var(--incorrect);
        }

        .opt-btn.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .explanation {
            margin-top: 15px;
            padding: 12px;
            background-color: #2a2a2a;
            border-left: 4px solid var(--primary-light);
            border-radius: 4px;
            font-size: 0.9rem;
            display: none;
        }

        .stats {
            font-weight: bold;
            color: var(--primary-light);
        }

        .submit-zh-container {
            text-align: center;
            margin: 30px 0;
        }

        .submit-zh-btn {
            background-color: var(--correct);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .submit-zh-btn:hover {
            background-color: #388e3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>A vér élettana & Immunológia</h1>
            <div class="subtitle">100 feleletválasztós kérdéses adatbázis & ZH Mód</div>
        </header>

        <div class="controls">
            <div>
                <label for="categoryFilter">Mód / Témakör: </label>
                <select id="categoryFilter" onchange="handleModeChange()">
                    <option value="all">Összes témakör (100 kérdés)</option>
                    <option value="1">1. Vízterek és a vér összetétele</option>
                    <option value="2">2. Vörösvértestek & Hemoglobin</option>
                    <option value="3">3. Fehérvérsejtek & Gyulladás</option>
                    <option value="4">4. Vérlemezkék & Véralvadás</option>
                    <option value="5">5. Immunológiai alapok & Limfociták</option>
                    <option value="6">6. Vércsoportok (ABO, Rh)</option>
                </select>
            </div>
            <button class="zh-btn" onclick="startZhMode()">⚡ Új ZH Mód (10 random kérdés)</button>
            <div class="stats" id="scoreBoard">
                Kitöltve: 0 / 100 | Helyes: 0
            </div>
        </div>

        <div id="questionsContainer"></div>
        <div id="submitZhContainer" class="submit-zh-container" style="display: none;">
            <button class="submit-zh-btn" onclick="submitZh()">ZH Beküldése & Értékelés</button>
        </div>
    </div>

    <script>
        const rawDatabase = [
            // 1. Vízterek és a vér összetétele
            { cat: 1, q: "Egy egészséges, sovány férfi testtömegének hány százalékát alkotja folyadék?[cite: 2]", opts: ["45%", "55%", "60%", "80%"], ans: 2, exp: "A férfiak testtömegének kb. 60%-a folyadék, míg a nőknél ez az arány kb. 55%[cite: 2]." },
            { cat: 1, q: "A szervezet teljes folyadéktérfogatának mekkora része található az intracelluláris térben?[cite: 2]", opts: ["1/3 része", "1/2 része", "2/3 része", "80%-a"], ans: 2, exp: "A teljes folyadéktérfogat 2/3-a sejten belüli (intracelluláris), 1/3-a pedig sejten kívüli folyadék[cite: 2]." },
            { cat: 1, q: "A teljes testtömeg hány százalékát teszi ki az extracelluláris folyadék térfogata?[cite: 3]", opts: ["4%", "16%", "20%", "60%"], ans: 2, exp: "Az extracelluláris folyadék a teljes testtömeg kb. 20%-át teszi ki[cite: 3]." },
            { cat: 1, q: "Az extracelluláris folyadéktér mekkora hányadát alkotja az intersticiális (szövet közötti) folyadék?[cite: 2, 3]", opts: ["20%", "60%", "80%", "91.5%"], ans: 2, exp: "Az extracelluláris folyadék 80%-a intersticiális folyadék, 20%-a pedig vérplazma[cite: 2, 3]." },
            { cat: 1, q: "Átlagosan a teljes testtömeg hány százalékát adja maga a vér?[cite: 4]", opts: ["4%", "8%", "12%", "20%"], ans: 1, exp: "A vér a testtömeg nagyjából 8%-át teszi ki[cite: 4]." },
            { cat: 1, q: "Mekkora a vérplazma átlagos aránya a teljes vértérfogathoz képest?[cite: 4]", opts: ["37-54%", "45%", "55%", "60%"], ans: 2, exp: "A vérplazma a vér térfogatának kb. 55%-át alkotja (45% az alakos elemek aránya)[cite: 4]." },
            { cat: 1, q: "Mi a vérplazma legfőbb összetevője és mekkora annak az aránya?[cite: 4]", opts: ["Fehérjék (7%)", "Víz (91,5%)", "Elektrolitok (1,5%)", "Albumin (60%)"], ans: 1, exp: "A vérplazma 91,5%-a víz, 7%-a fehérje és 1,5%-a egyéb oldott anyag[cite: 4]." },
            { cat: 1, q: "Melyik a legnagyobb mennyiségben jelen lévő plazmafehérje?[cite: 4]", opts: ["Fibrinogén", "Globulinok", "Albumin", "Prothrombin"], ans: 2, exp: "Az albumin teszi ki a plazmafehérjék kb. 60%-át[cite: 4]." },
            { cat: 1, q: "A plazmafehérjék kb. hány százalékát teszik ki a globulinok?[cite: 4]", opts: ["4%", "35%", "60%", "<1%"], ans: 1, exp: "A globulinok (ellenanyagok/immunglobulinok) a plazmafehérjék kb. 35%-át adják[cite: 4]." },
            { cat: 1, q: "Milyen szerepet tölt be a plazmafehérjék kb. 4%-át alkotó fibrinogén?[cite: 4]", opts: ["Tápanyagszállítás", "Véralvadás", "O2-kötés", "Enzimatikus emésztés"], ans: 1, exp: "A fibrinogén a véralvadás kulcsfehérjéje, a hálóváz alapanyaga[cite: 4, 13]." },
            { cat: 1, q: "Milyen normál tartományban van a fehérvérsejtek száma 1 µl vérben?[cite: 4]", opts: ["150 000 - 400 000", "5 000 - 10 000", "4,8 - 5,4 millió", "1 000 - 3 000"], ans: 1, exp: "A normál fehérvérsejtszám 5 000 – 10 000 db / µl[cite: 4]." },
            { cat: 1, q: "Milyen normál tartományban található a vörösvértestek száma 1 µl vérben?[cite: 4, 7]", opts: ["5 000 - 10 000", "150 000 - 400 000", "4,5 - 5,4 millió", "10 - 12 millió"], ans: 2, exp: "A vörösvértestszám normál értéke körülbelül 4,5 – 5,4 millió db / µl[cite: 4, 7]." },
            { cat: 1, q: "Mennyi a vérlemezkék (trombociták) normál száma mikroliterenként?[cite: 4, 12]", opts: ["5 000 - 10 000", "150 000 - 400 000", "1 - 2 millió", "50 000 - 100 000"], ans: 1, exp: "A vérlemezkék normál száma 150 000 – 400 000 db / µl[cite: 4, 12]." },
            { cat: 1, q: "Melyik szerv felelős a felnőttkori vérképzésért (hematopoezis)?[cite: 6]", opts: ["Máj", "Lép", "Vörös csontvelő", "Csecsemőmirigy"], ans: 2, exp: "Felnőttkorban a vérképzés kizárólag a vörös csontvelőben zajlik[cite: 6]." },
            { cat: 1, q: "Hol zajlik a vérképzés az embrióban a csontvelő átvétele előtt?[cite: 6]", opts: ["Csak szikhólyagban", "Szikhólyag, máj, lép", "Csecsemőmirigy és vesék", "Agyalapi mirigy"], ans: 1, exp: "Az embrióban a szikhólyag, majd a máj és a lép végzi a vérképzést[cite: 6]." },

            // 2. Vörösvértestek & Hemoglobin
            { cat: 2, q: "Mi a pontos élettani definíciója a hematokritnak?[cite: 7]", opts: ["A plazmafehérjék aránya", "Az alakos elemek (főleg vvt) térfogati aránya a vérben", "A vvt-k átmérője", "A hemoglobin tömege"], ans: 1, exp: "A hematokrit az alakos elemek (gyakorlatilag vörösvértestek) térfogataránya a vérben[cite: 4, 7]." },
            { cat: 2, q: "Mennyi a vörösvértestek átlagos élettartama a keringésben?[cite: 7, 8]", opts: ["9-11 nap", "30 nap", "120 nap", "Több mint 10 év"], ans: 2, exp: "A vörösvértestek körülbelül 120 napig keringnek a vérben[cite: 7, 8]." },
            { cat: 2, q: "Milyen alaki és szerkezeti jellemzője van az érett emberi vörösvértestnek?[cite: 7]", opts: ["Gömb alakú, magvas", "Sejtmag nélküli, bikonkáv (fánk) alakú", "Karéjos magvú, amőboid", "Magvas, csillós"], ans: 1, exp: "Az érett vörösvértest sejtmag nélküli, bikonkáv fánk alakú sejt[cite: 7]." },
            { cat: 2, q: "Hogyan nevezzük a sejtmagját nemrég elveszített, fiatal vörösvértestet?[cite: 6, 7]", opts: ["Erythroblast", "Retikulocita", "Megakariocita", "Monocita"], ans: 1, exp: "Az erythroblast magvesztése után keletkező fiatal alak a retikulocita[cite: 6, 7]." },
            { cat: 2, q: "Hol és milyen ingerre termelődik az eritropoetin (EPO) hormon?[cite: 7]", opts: ["Májban, magas O2 szintre", "Vesében, O2 hiányra (hipoxia)", "Csontvelőben, alacsony Ca2+-ra", "Lépben, fertőzésekre"], ans: 1, exp: "Az EPO a vesében termelődik válaszul a szöveti oxigénhiányra[cite: 7]." },
            { cat: 2, q: "Milyen szerkezetű a felnőtt hemoglobin (HbA) fehérjerésze?[cite: 7]", opts: ["2 α és 2 β láncból álló tetramer", "4 α láncból álló fehérje", "1 α és 1 β lánc dimerje", "2 γ és 2 β lánc"], ans: 0, exp: "A felnőtt hemoglobin 4 fehérjeláncból áll: 2 alpha és 2 beta láncból (α2β2)[cite: 7]." },
            { cat: 2, q: "Mi adja a hem csoport oxigénkötő képességét?[cite: 7]", opts: ["Kalciumion", "Vastartalmú porfirinváz", "Magvas enzim", "Fibrin szálak"], ans: 1, exp: "A hem egy vastartalmú (Fe2+) porfirinváz, ami reverzibilisen köti az oxigént[cite: 7]." },
            { cat: 2, q: "Milyen molekuláris hiba okozza a sarlósejtes vérszegénységet?[cite: 7]", opts: ["α-lánc hiánya", "β-lánc 6. aminosavának pontmutációja", "Vasion hiánya", "Sejtmag megmaradása"], ans: 1, exp: "A sarlósejtes anaemia a hemoglobin béta-láncának 6. aminosav-pontmutációja[cite: 7]." },
            { cat: 2, q: "Mi a vérszegénység (anaemia) lényege?[cite: 7]", opts: ["Magas fehérvérsejtszám", "Alacsony vvt-szám vagy Hb-tartalom (romlik az O2-ellátás)", "Vérlemezkék hiánya", "Plazma vízhiánya"], ans: 1, exp: "Az anaemia a vvt-k alacsony számára vagy hiányos hemoglobintartalmára utal[cite: 7]." },
            { cat: 2, q: "Hol zajlik az elöregedett vörösvértestek lebontása?[cite: 8]", opts: ["Tüdőben és vesében", "Lép, máj és csontvelő makrofágjaiban", "Nyirokcsomókban", "Vékonybélben"], ans: 1, exp: "Az elöregedett vvt-ket a lép, a máj és a csontvelő makrofágjai kebelezik be[cite: 8]." },
            { cat: 2, q: "Mi lesz a hemoglobin globin részéből a lebontás során?[cite: 8]", opts: ["Bilirubin", "Aminosavak (újrahasznosulnak)", "Urobilinogen", "Széklettel távozik"], ans: 1, exp: "A globin aminosavakra hidrolizál, amiket a szervezet újra felhasznál[cite: 8]." },
            { cat: 2, q: "Milyen szállítófehérje viszi a hemből származó vasat (Fe3+) a vérben?[cite: 8]", opts: ["Ferritin", "Transferrin", "Albumin", "Trombomodulin"], ans: 1, exp: "A vasat a vérplazmában a transferrin szállítja[cite: 8]." },
            { cat: 2, q: "Hol és milyen formában tárolódik a felesleges vas?[cite: 8]", opts: ["Vesében transferrinként", "Májban ferritin formájában", "Lépben bilirubinként", "Csontban urobilinként"], ans: 1, exp: "A vas a májban tárolódik ferritin formájában[cite: 8]." },
            { cat: 2, q: "Milyen zöldes, majd sárgás epepigmentté alakul a porfirinváz?[cite: 8]", opts: ["Biliverdinből Bilirubin", "Stercobilinből Urobilin", "Globinból Hem", "Ferritinből Transferrin"], ans: 0, exp: "A hem porfirinváza biliverdinné, majd bilirubinná alakul át[cite: 8]." },
            { cat: 2, q: "Hova kerül a májból kikerülő bilirubin?[cite: 8]", opts: ["Vizeletbe vesén át", "Epén keresztül a vékonybélbe", "Vissza csontvelőbe", "Tüdőbe kilégzésre"], ans: 1, exp: "A máj a bilirubint az epébe választja ki, így a vékonybélbe jut[cite: 8]." },
            { cat: 2, q: "Mi adja a széklet jellegzetes barnás színét?[cite: 8]", opts: ["Stercobilin", "Urobilin", "Transferrin", "Bilirubin"], ans: 0, exp: "A bélbaktériumok által átalakított stercobilin adja a széklet színét[cite: 8]." },
            { cat: 2, q: "Melyik molekula adja a vizelet sárgás színét?[cite: 8]", opts: ["Ferritin", "Biliverdin", "Urobilin", "Fibrin"], ans: 2, exp: "Az urobilinogen felszívódó része a vesén át urobilinként ürül[cite: 8]." },

            // 3. Fehérvérsejtek & Gyulladás
            { cat: 3, q: "A fehérvérsejtek hány százalékát teszik ki a granulociták?[cite: 9, 10]", opts: ["20-30%", "50-70%", "60-80%", "<1%"], ans: 2, exp: "A granulociták a fehérvérsejtek 60–80%-át alkotják[cite: 9, 10]." },
            { cat: 3, q: "Melyik a leggyakoribb granulocita típus a vérben (50-70%)?[cite: 9]", opts: ["Eozinofil", "Bazofil", "Neutrofil", "Monocita"], ans: 2, exp: "A neutrofil granulocita a legnépesebb fehérvérsejt csoport (50-70%)[cite: 9]." },
            { cat: 3, q: "Milyen becenevet adnak a neutrofil granulocitáknak?[cite: 9]", opts: ["Makrofágok", "Mikrofágok", "Plazmasejtek", "Hízósejtek"], ans: 1, exp: "A neutrofileket 'mikrofágoknak' is nevezik baktérium-fagocitáló képességük miatt[cite: 9]." },
            { cat: 3, q: "Milyen anyagokat tartalmaznak a neutrofil granulociták granulumai?[cite: 9]", opts: ["Hisztamin és heparin", "Proteolitikus enzimek, lizozim, oxidánsok", "Perforin és granzim", "EPO és trombopoetin"], ans: 1, exp: "A neutrofil granulumok emésztőenzimeket, lizozimot és oxidánsokat tartalmaznak[cite: 9]." },
            { cat: 3, q: "Milyen állapot jele lehet a megemelkedett neutrofilszám?[cite: 9]", opts: ["Bakteriális fertőzés, gyulladás, stressz", "Parazita fertőzés", "Allergiás sokk", "Vírusfertőzés"], ans: 0, exp: "Bakteriális fertőzések és akut gyulladások hatására a neutrofilek száma nő[cite: 9]." },
            { cat: 3, q: "Melyik granulocita véd a parazita fertőzések ellen?[cite: 9]", opts: ["Neutrofil", "Eozinofil", "Bazofil", "NK-sejt"], ans: 1, exp: "Az eozinofil granulociták a paraziták elleni védekezésre specializálódtak[cite: 9]." },
            { cat: 3, q: "Milyen enzimet bocsátanak ki az eozinofil granulociták az allergia mérséklésére?[cite: 9]", opts: ["Lizozim", "Hisztamináz", "Plazmin", "Kallikrein"], ans: 1, exp: "Az eozinofilek hisztaminázt szabadítanak fel, ami bontja a hisztamint[cite: 9]." },
            { cat: 3, q: "Melyik szöveti sejtre hasonlítanak a bazofil granulociták (<1%)?[cite: 10]", opts: ["Fibroblasztok", "Hízósejtek", "Makrofágok", "Plazmasejtek"], ans: 1, exp: "A bazofilek a hízósejtekhez hasonlítanak, hisztamint és heparint tartalmaznak[cite: 10]." },
            { cat: 3, q: "Milyen hatást fejt ki a hisztamin az erekre?[cite: 10, 19]", opts: ["Érszűkület", "Értágulat (vazodilatáció) és áteresztőképőség-növekedés", "Véralvadás beindítása", "Sejtképzés"], ans: 1, exp: "A hisztamin értágulatot vált ki és növeli a kapillárisok permeabilitását[cite: 10, 19]." },
            { cat: 3, q: "Mivé alakulnak át a monociták (2-8%) a szövetekben?[cite: 10]", opts: ["Bazofil granulocitává", "Szöveti makrofággá", "T-limfocitává", "Vérlemezkévé"], ans: 1, exp: "A monociták a szövetekbe lépve szöveti makrofágokká alakulnak[cite: 10]." },
            { cat: 3, q: "Hogyan nevezzük a máj sajátos makrofágjait?[cite: 10]", opts: ["Alveoláris makrofág", "Kupffer-sejt", "Langerhans-sejt", "Microglia"], ans: 1, exp: "A máj rögzült makrofágjai a Kupffer-sejtek[cite: 10]." },
            { cat: 3, q: "Milyen fertőzésnél emelkedik meg a monociták száma?[cite: 10]", opts: ["Bakteriális fertőzés", "Vírusos és gombás fertőzések", "Súlyos vérvesztés", "Kalciumhiány"], ans: 1, exp: "A monociták magas száma vírusos vagy gombás fertőzésekre utal[cite: 10]." },
            { cat: 3, q: "Mi a kemotaxis jelensége?[cite: 9, 19]", opts: ["O2-kötés", "Irányított sejtvándorlás kémiai ingerek felé", "Elhalás", "Ellenanyag-termelés"], ans: 1, exp: "A kemotaxis a fagocitáló sejtek kémiai ingerek irányába történő mozgása[cite: 9, 19]." },

            activeQuestions = shuffled.slice(0, 10);
            userAnswers = new Array(10).fill(null);
            correctCount = 0;
            
            updateScore();
            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById("questionsContainer");
            container.innerHTML = "";

            const isZh = (currentMode === "zh");

            if (isZh) {
                const zhGroup = document.createElement("div");
                zhGroup.className = "category-group";
                
                const titleDiv = document.createElement("div");
                titleDiv.className = "category-title";
                titleDiv.innerText = "⚡ ZH MÓD (10 véletlenszerű kérdés) - Jelöld meg a válaszokat, majd kattints a beküldésre!";
                zhGroup.appendChild(titleDiv);

                activeQuestions.forEach((item, qIdx) => {
                    const card = createCard(item.qObj, qIdx, item.originalIndex, true);
                    zhGroup.appendChild(card);
                });

                container.appendChild(zhGroup);
            } else {
                // Rendes kategóriás megjelenítés
                const categories = {
                    1: "1. Vízterek és a vér összetétele",
                    2: "2. Vörösvértestek & Hemoglobin",
                    3: "3. Fehérvérsejtek & Gyulladás",
                    4: "4. Vérlemezkék & Véralvadás",
                    5: "5. Immunológiai alapok & Limfociták",
                    6: "6. Vércsoportok (ABO, Rh)"
                };

                const catGroup = {};
                activeQuestions.forEach((item) => {
                    if (!catGroup[item.qObj.cat]) catGroup[item.qObj.cat] = [];
                    catGroup[item.qObj.cat].push(item);
                });

                for (let catId in catGroup) {
                    const groupDiv = document.createElement("div");
                    groupDiv.className = "category-group";

                    const titleDiv = document.createElement("div");
                    titleDiv.className = "category-title";
                    titleDiv.innerText = categories[catId];
                    groupDiv.appendChild(titleDiv);

                    catGroup[catId].forEach((item, qIdxInGroup) => {
                        const card = createCard(item.qObj, activeQuestions.indexOf(item), item.originalIndex, false);
                        groupDiv.appendChild(card);
                    });

                    container.appendChild(groupDiv);
                }
            }
        }

        function createCard(qObj, activeIdx, originalIndex, isZh) {
            const card = document.createElement("div");
            card.className = "q-card";

            const header = document.createElement("div");
            header.className = "q-header";
            
            const numText = isZh ? `ZH / ${activeIdx + 1}. Kérdés` : `#${originalIndex + 1}`;
            header.innerHTML = `<span class="q-number">${numText}</span><span class="q-text">${qObj.q}</span>`;
            card.appendChild(header);

            const optionsDiv = document.createElement("div");
            optionsDiv.className = "options";

            const expDiv = document.createElement("div");
            expDiv.className = "explanation";
            expDiv.id = `exp-${activeIdx}`;
            expDiv.innerText = `Magyarázat: ${qObj.exp}`;

            qObj.opts.forEach((optText, optIdx) => {
                const btn = document.createElement("button");
                btn.className = "opt-btn";
                btn.innerText = `${String.fromCharCode(65 + optIdx)}) ${optText}`;

                if (isZh) {
                    if (!zhSubmitted) {
                        if (userAnswers[activeIdx] === optIdx) {
                            btn.classList.add("selected");
                        }
                        btn.onclick = () => {
                            userAnswers[activeIdx] = optIdx;
                            renderQuestions();
                            updateScore();
                        };
                    } else {
                        btn.classList.add("disabled");
                        if (optIdx === qObj.ans) {
                            btn.classList.add("correct");
                        }
                        if (userAnswers[activeIdx] === optIdx && optIdx !== qObj.ans) {
                            btn.classList.add("incorrect");
                        }
                    }
                } else {
                    // Normál azonnali visszajelzéses mód
                    btn.onclick = () => selectOptionNormal(activeIdx, optIdx);

                    if (userAnswers[activeIdx] !== null) {
                        btn.classList.add("disabled");
                        if (optIdx === qObj.ans) {
                            btn.classList.add("correct");
                        }
                        if (userAnswers[activeIdx] === optIdx && optIdx !== qObj.ans) {
                            btn.classList.add("incorrect");
                        }
                    }
                }

                optionsDiv.appendChild(btn);
            });

            card.appendChild(optionsDiv);
            card.appendChild(expDiv);

            if ((!isZh && userAnswers[activeIdx] !== null) || (isZh && zhSubmitted)) {
                expDiv.style.display = "block";
            }

            return card;
        }

        function selectOptionNormal(activeIdx, optIdx) {
            if (userAnswers[activeIdx] !== null) return;

            userAnswers[activeIdx] = optIdx;
            if (optIdx === activeQuestions[activeIdx].qObj.ans) {
                correctCount++;
            }

            updateScore();
            renderQuestions();
        }

        function submitZh() {
            if (zhSubmitted) return;
            zhSubmitted = true;
            
            correctCount = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === activeQuestions[idx].qObj.ans) {
                    correctCount++;
                }
            });

            updateScore();
            renderQuestions();
            alert(`ZH Befejezve!\nEredményed: ${correctCount} / 10 pont (${(correctCount/10)*100}%)`);
        }

        function updateScore() {
            const answered = userAnswers.filter(a => a !== null).length;
            const total = activeQuestions.length;
            
            if (currentMode === "zh") {
                if (zhSubmitted) {
                    document.getElementById("scoreBoard").innerText = `ZH Eredmény: ${correctCount} / 10 (${(correctCount/10)*100}%)`;
                } else {
                    document.getElementById("scoreBoard").innerText = `ZH Folyamatban: ${answered} / 10 megválaszolva`;
                }
            } else {
                document.getElementById("scoreBoard").innerText = `Kitöltve: ${answered} / ${total} | Helyes: ${correctCount}`;
            }
        }

        // Kezdeti inicializálás
        handleModeChange();
    </script>
</body>
</html>
