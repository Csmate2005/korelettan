<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A vér élettana - 200 Kérdéses Teljes Adatbázis & ZH Mód</title>
    <style>
        :root {
            --primary: #8b0000;
            --primary-light: #ff4d4d;
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-card: #252525;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --correct: #2e7d32;
            --incorrect: #c62828;
            --border: #333333;
            --accent: #d32f2f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-light);
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        select, button.zh-btn {
            background-color: var(--surface-card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button.zh-btn {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
        }

        button.zh-btn:hover {
            background-color: var(--primary-light);
        }

        .category-group {
            margin-bottom: 40px;
        }

        .category-title {
            background-color: var(--primary);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .q-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .q-number {
            font-weight: bold;
            color: var(--primary-light);
            margin-right: 10px;
        }

        .q-text {
            font-size: 1.05rem;
            font-weight: 500;
            flex-grow: 1;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .opt-btn {
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .opt-btn:hover {
            background-color: #303030;
            border-color: #555;
        }

        .opt-btn.selected {
            border-color: var(--primary-light);
            background-color: #382020;
        }

        .opt-btn.correct {
            background-color: var(--correct) !important;
            color: white;
            border-color: var(--correct);
        }

        .opt-btn.incorrect {
            background-color: var(--incorrect) !important;
            color: white;
            border-color: var(--incorrect);
        }

        .opt-btn.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .explanation {
            margin-top: 15px;
            padding: 12px;
            background-color: #2a2a2a;
            border-left: 4px solid var(--primary-light);
            border-radius: 4px;
            font-size: 0.9rem;
            display: none;
        }

        .stats {
            font-weight: bold;
            color: var(--primary-light);
        }

        .submit-zh-container {
            text-align: center;
            margin: 30px 0;
        }

        .submit-zh-btn {
            background-color: var(--correct);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .submit-zh-btn:hover {
            background-color: #388e3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>A vér élettana & Immunológia</h1>
            <div class="subtitle">200 Kérdéses Teljes Adatbázis & ZH Mód</div>
        </header>

        <div class="controls">
            <div>
                <label for="categoryFilter">Mód / Témakör: </label>
                <select id="categoryFilter" onchange="handleModeChange()">
                    <option value="all">Összes témakör (200 kérdés)</option>
                    <option value="1">1. Vízterek és a vér összetétele</option>
                    <option value="2">2. Vörösvértestek & Hemoglobin</option>
                    <option value="3">3. Fehérvérsejtek & Gyulladás</option>
                    <option value="4">4. Vérlemezkék & Véralvadás</option>
                    <option value="5">5. Immunológiai alapok & Limfociták</option>
                    <option value="6">6. Vércsoportok (ABO, Rh)</option>
                </select>
            </div>
            <button class="zh-btn" onclick="startZhMode()">⚡ Új ZH Mód (10 random kérdés)</button>
            <div class="stats" id="scoreBoard">
                Kitöltve: 0 / 200 | Helyes: 0
            </div>
        </div>

        <div id="questionsContainer"></div>
        <div id="submitZhContainer" class="submit-zh-container" style="display: none;">
            <button class="submit-zh-btn" onclick="submitZh()">ZH Beküldése & Értékelés</button>
        </div>
    </div>

    <script>
        const rawDatabase = [
            // 1. Vízterek és a vér összetétele (35 kérdés)
            { cat: 1, q: "Egy egészséges, sovány férfi testtömegének hány százalékát alkotja folyadék?", opts: ["45%", "55%", "60%", "80%"], ans: 2, exp: "A férfiak testtömegének kb. 60%-a folyadék, míg a nőknél ez az arány kb. 55%." },
            { cat: 1, q: "Egy átlagos felnőtt nő testtömegének hány százalékát alkotja folyadék?", opts: ["45%", "55%", "60%", "70%"], ans: 1, exp: "A nők testében a magasabb zsírarány miatt a vízszázalék kb. 55%." },
            { cat: 1, q: "A szervezet teljes folyadéktérfogatának mekkora része található az intracelluláris térben?", opts: ["1/3 része", "1/2 része", "2/3 része", "80%-a"], ans: 2, exp: "A teljes folyadéktérfogat 2/3-a sejten belüli (intracelluláris), 1/3-a pedig sejten kívüli folyadék." },
            { cat: 1, q: "A teljes testtömeg hány százalékát teszi ki az extracelluláris folyadék térfogata?", opts: ["4%", "16%", "20%", "60%"], ans: 2, exp: "Az extracelluláris folyadék a teljes testtömeg kb. 20%-át teszi ki." },
            { cat: 1, q: "Az extracelluláris folyadéktér mekkora hányadát alkotja az intersticiális (szövet közötti) folyadék?", opts: ["20%", "60%", "80%", "91.5%"], ans: 2, exp: "Az extracelluláris folyadék 80%-a intersticiális folyadék, 20%-a pedig vérplazma." },
            { cat: 1, q: "A teljes testtömeg hány százalékát adja az intersticiális folyadék önmagában?", opts: ["4%", "8%", "16%", "20%"], ans: 2, exp: "Az intersticiális folyadék a testtömeg kb. 16%-át adja (20% extracelluláris * 80%)." },
            { cat: 1, q: "A teljes testtömeg hány százalékát adja a vérplazma térfogata?", opts: ["4%", "8%", "12%", "16%"], ans: 0, exp: "A vérplazma a testtömeg nagyjából 4%-át teszi ki." },
            { cat: 1, q: "Átlagosan a teljes testtömeg hány százalékát adja maga a teljes vértérfogat?", opts: ["4%", "8%", "12%", "20%"], ans: 1, exp: "A vér a testtömeg nagyjából 8%-át teszi ki." },
            { cat: 1, q: "Hány liternyi teljes vízmennyiség található egy 70 kg-os egészséges férfiban?", opts: ["28 liter", "35 liter", "42 liter", "50 liter"], ans: 2, exp: "70 kg * 0,60 = 42 liter." },
            { cat: 1, q: "Hány liternyi intracelluláris folyadéknak felel meg egy 70 kg-os férfi víztere?", opts: ["14 liter", "28 liter", "42 liter", "8 liter"], ans: 1, exp: "42 liter 2/3-a = 28 liter." },
            { cat: 1, q: "Hány liternyi az extracelluláris folyadéktér egy 70 kg-os férfiban?", opts: ["7 liter", "14 liter", "21 liter", "28 liter"], ans: 1, exp: "42 liter 1/3-a = 14 liter." },
            { cat: 1, q: "Mekkora a vérplazma átlagos aránya a teljes vértérfogathoz képest?", opts: ["37-54%", "45%", "55%", "60%"], ans: 2, exp: "A vérplazma a vér térfogatának kb. 55%-át alkotja (45% az alakos elemek aránya)." },
            { cat: 1, q: "Mekkora az alakos elemek átlagos térfogati aránya a vérben?", opts: ["30%", "45%", "55%", "70%"], ans: 1, exp: "Az alakos elemek (vvt, fvs, trombocita) a vér kb. 45%-át teszik ki." },
            { cat: 1, q: "Mi a vérplazma legfőbb összetevője és mekkora annak az aránya?", opts: ["Fehérjék (7%)", "Víz (91,5%)", "Elektrolitok (1,5%)", "Albumin (60%)"], ans: 1, exp: "A vérplazma 91,5%-a víz, 7%-a fehérje és 1,5%-a egyéb oldott anyag." },
            { cat: 1, q: "A vérplazma hány százalékát alkotják a plazmafehérjék?", opts: ["1,5%", "7%", "12%", "55%"], ans: 1, exp: "A plazmafehérjék a plazma kb. 7%-át adják." },
            { cat: 1, q: "Melyik a legnagyobb mennyiségben jelen lévő plazmafehérje?", opts: ["Fibrinogén", "Globulinok", "Albumin", "Prothrombin"], ans: 2, exp: "Az albumin teszi ki a plazmafehérjék kb. 60%-át." },
            { cat: 1, q: "A plazmafehérjék kb. hány százalékát teszik ki a globulinok?", opts: ["4%", "35%", "60%", "<1%"], ans: 1, exp: "A globulinok a plazmafehérjék kb. 35%-át adják." },
            { cat: 1, q: "Milyen szerepet tölt be a plazmafehérjék kb. 4%-át alkotó fibrinogén?", opts: ["Tápanyagszállítás", "Véralvadás", "O2-kötés", "Enzimatikus emésztés"], ans: 1, exp: "A fibrinogén a véralvadás kulcsfehérjéje, a hálóváz alapanyaga." },
            { cat: 1, q: "Melyik szerv termeli a plazmafehérjék (albumin, fibrinogén) döntő többségét?", opts: ["Lép", "Vese", "Máj", "Vörös csontvelő"], ans: 2, exp: "A plazmafehérjék zömét a máj szintetizálja." },
            { cat: 1, q: "Mi az albuminok legfőbb élettani funkciója a keringésben?", opts: ["Oxigénszállítás", "Kolloidoszmotikus (onkotikus) nyomás fenntartása", "Véralvadási kaszkád", "Antigén-bemutatás"], ans: 1, exp: "Az albumin biztosítja a plazma kolloidoszmotikus nyomását, bent tartva a vizet az erekben." },
            { cat: 1, q: "Milyen normál tartományban van a fehérvérsejtek száma 1 µl vérben?", opts: ["150 000 - 400 000", "5 000 - 10 000", "4,8 - 5,4 millió", "1 000 - 3 000"], ans: 1, exp: "A normál fehérvérsejtszám 5 000 – 10 000 db / µl." },
            { cat: 1, q: "Milyen normál tartományban található a vörösvértestek száma 1 µl vérben?", opts: ["5 000 - 10 000", "150 000 - 400 000", "4,5 - 5,4 millió", "10 - 12 millió"], ans: 2, exp: "A vörösvértestszám normál értéke körülbelül 4,5 – 5,4 millió db / µl." },
            { cat: 1, q: "Mennyi a vérlemezkék (trombociták) normál száma mikroliterenként?", opts: ["5 000 - 10 000", "150 000 - 400 000", "1 - 2 millió", "50 000 - 100 000"], ans: 1, exp: "A vérlemezkék normál száma 150 000 – 400 000 db / µl." },
            { cat: 1, q: "Melyik szerv felelős a felnőttkori vérképzésért (hematopoezis)?", opts: ["Máj", "Lép", "Vörös csontvelő", "Csecsemőmirigy"], ans: 2, exp: "Felnőttkorban a vérképzés kizárólag a vörös csontvelőben zajlik." },
            { cat: 1, q: "Hol zajlik a vérképzés az embrióban a csontvelő átvétele előtt?", opts: ["Csak szikhólyagban", "Szikhólyag, máj, lép", "Csecsemőmirigy és vesék", "Agyalapi mirigy"], ans: 1, exp: "Az embrióban a szikhólyag, majd a máj és a lép végzi a vérképzést." },
            { cat: 1, q: "Milyen őssejtekből származnak a vér valamennyi alakos elemei?", opts: ["Pluripotens mesenchymalis őssejt", "Pluripotens hematopoetikus őssejt", "Embryonalis őssejt", "Monocita előalak"], ans: 1, exp: "Valamennyi vérsejt a csontvelői pluripotens hematopoetikus őssejtekből differenciálódik." },
            { cat: 1, q: "Hány liter vérplazmát tartalmaz egy felnőtt ember szervezete átlagosan?", opts: ["1,5 liter", "2,7 - 3 liter", "4,5 - 5 liter", "6 liter"], ans: 1, exp: "A kb. 5 liternyi teljes vér 55%-a adja a kb. 2,7-3 liter plazmát." },
            { cat: 1, q: "Mi történik a vérplazmával, ha eltávolítjuk belőle a fibrinogént?", opts: ["Trombussá válik", "Vérsavó (szérum) keletkezik", "Hematokrit nő", "Eritropoetin szabadul fel"], ans: 1, exp: "A fibrinogénmentes plazma a vérsavó (szérum)." },
            { cat: 1, q: "Milyen elektrolit a legnagyobb koncentrációjú kation az extracelluláris térben?", opts: ["K+", "Na+", "Ca2+", "Mg2+"], ans: 1, exp: "Az extracelluláris tér fő kationja a nátrium (Na+)." },
            { cat: 1, q: "Melyik kation a legfőbb az intracelluláris térben?", opts: ["Na+", "K+", "Ca2+", "Fe2+"], ans: 1, exp: "Az intracelluláris tér fő kationja a kálium (K+)." },
            { cat: 1, q: "Milyen tartományban mozog a vérplazma normál pH értéke?", opts: ["6,8 - 7,0", "7,35 - 7,45", "7,8 - 8,0", "5,5 - 6,5"], ans: 1, exp: "A vér pH-ja szigorúan szabályozott: 7,35 – 7,45 közötti." },
            { cat: 1, q: "A plazmafehérjék melyik csoportjába tartoznak az ellenanyagok (antitestek)?", opts: ["Albuminok", "Gamma-globulinok", "Fibrinogén", "Prothrombin"], ans: 1, exp: "Az antitestek az immunglobulinok, más néven gamma-globulinok." },
            { cat: 1, q: "Milyen transzportfehérje felelős a zsírsavak és bizonyos gyógyszerek kötéséért a plazmában?", opts: ["Fibrinogén", "Albumin", "Transferrin", "Hemoglobin"], ans: 1, exp: "Az albumin jelentős szállítófehérje (zsírsavak, bilirubin, gyógyszerek)." },
            { cat: 1, q: "Milyen folyadéktérbe tartozik a csarnokvíz és a liquour (agy-gerincvelői folyadék)?", opts: ["Intracelluláris", "Transzcelluláris (extracelluláris része)", "Intersticiális", "Plazmatér"], ans: 1, exp: "A speciális elválasztott terek az extracelluláris folyadék transzcelluláris részét képezik." },
            { cat: 1, q: "Milyen hatással van a plazmafehérjék szintjének lecsökkenése (hypoproteinaemia) a szövetekre?", opts: ["Kiszáradás", "Ödémaképződés (duzzanat)", "Magas vérnyomás", "Trombusképződés"], ans: 1, exp: "Az onkotikus nyomás leesése miatt a víz kiáramlik a szövetek közé (ödéma)." },

            // 2. Vörösvértestek & Hemoglobin (35 kérdés)
            { cat: 2, q: "Mi a pontos élettani definíciója a hematokritnak?", opts: ["A plazmafehérjék aránya", "Az alakos elemek (főleg vvt) térfogati aránya a vérben", "A vvt-k átmérője", "A hemoglobin tömege"], ans: 1, exp: "A hematokrit az alakos elemek térfogataránya a teljes vérben." },
            { cat: 2, q: "Mekkora a normál hematokrit érték nőkben?", opts: ["30-35%", "37-47%", "42-52%", "55-65%"], ans: 1, exp: "Nőkben a normál hematokrit érték kb. 37–47%." },
            { cat: 2, q: "Mekkora a normál hematokrit érték férfiakban?", opts: ["30-35%", "37-47%", "42-52%", "55-65%"], ans: 2, exp: "Férfiakban a normál hematokrit érték kb. 42–52%." },
            { cat: 2, q: "Mennyi a vörösvértestek átlagos élettartama a keringésben?", opts: ["9-11 nap", "30 nap", "120 nap", "Több mint 10 év"], ans: 2, exp: "A vörösvértestek körülbelül 120 napig keringnek a vérben." },
            { cat: 2, q: "Milyen alaki és szerkezeti jellemzője van az érett emberi vörösvértestnek?", opts: ["Gömb alakú, magvas", "Sejtmag nélküli, bikonkáv (fánk) alakú", "Karéjos magvú, amőboid", "Magvas, csillós"], ans: 1, exp: "Az érett vörösvértest sejtmag nélküli, bikonkáv fánk alakú sejt." },
            { cat: 2, q: "Mekkora az érett vörösvértest átlagos átmérője?", opts: ["2-3 µm", "7-8 µm", "12-15 µm", "20-30 µm"], ans: 1, exp: "A vvt átmérője körülbelül 7,5 µm." },
            { cat: 2, q: "Hogyan nevezzük a sejtmagját nemrég elveszített, fiatal vörösvértestet?", opts: ["Erythroblast", "Retikulocita", "Megakariocita", "Monocita"], ans: 1, exp: "Az erythroblast magvesztése után keletkező fiatal alak a retikulocita." },
            { cat: 2, q: "Milyen arányban vannak jelen a retikulociták a perifériás vérben normálisan?", opts: ["0,5 - 1,5%", "5 - 10%", "15 - 20%", "0%"], ans: 0, exp: "A retikulociták aránya a vvt-k kb. 0,5–1,5%-a." },
            { cat: 2, q: "Hol és milyen ingerre termelődik az eritropoetin (EPO) hormon?", opts: ["Májban, magas O2 szintre", "Vesében, O2 hiányra (hipoxia)", "Csontvelőben, alacsony Ca2+-ra", "Lépben, fertőzésekre"], ans: 1, exp: "Az EPO a vesében termelődik válaszul a szöveti oxigénhiányra (hipoxia)." },
            { cat: 2, q: "Milyen szerkezetű a felnőtt hemoglobin (HbA) fehérjerésze?", opts: ["2 α és 2 β láncból álló tetramer", "4 α láncból álló fehérje", "1 α és 1 β lánc dimerje", "2 γ és 2 β lánc"], ans: 0, exp: "A felnőtt hemoglobin 4 fehérjeláncból áll: 2 alpha és 2 beta láncból (α2β2)." },
            { cat: 2, q: "Milyen globinláncokat tartalmaz a magzati hemoglobin (HbF)?", opts: ["2 α és 2 β", "2 α és 2 γ", "2 β és 2 γ", "4 γ lánc"], ans: 1, exp: "A magzati HbF szerkezete α2γ2, aminek nagyobb az O2-affinitása." },
            { cat: 2, q: "Mi adja a hem csoport oxigénkötő képességét?", opts: ["Kalciumion", "Vastartalmú porfirinváz (Fe2+)", "Magvas enzim", "Fibrin szálak"], ans: 1, exp: "A hem egy kétértékű vasat (Fe2+) tartalmazó porfirinváz." },
            { cat: 2, q: "Hány O2 molekulát tud megkötni egyetlen teljes hemoglobin tetramer?", opts: ["1", "2", "4", "8"], ans: 2, exp: "A 4 hem csoport mindegyike 1 O2-t köt, így összesen 4 O2 molekulát." },
            { cat: 2, q: "Milyen molekuláris hiba okozza a sarlósejtes vérszegénységet?", opts: ["α-lánc hiánya", "β-lánc 6. aminosavának pontmutációja", "Vasion hiánya", "Sejtmag megmaradása"], ans: 1, exp: "A sarlósejtes anaemia a hemoglobin béta-láncának 6. aminosav-pontmutációja." },
            { cat: 2, q: "Mi a vérszegénység (anaemia) lényege?", opts: ["Magas fehérvérsejtszám", "Alacsony vvt-szám vagy Hb-tartalom (romlik az O2-ellátás)", "Vérlemezkék hiánya", "Plazma vízhiánya"], ans: 1, exp: "Az anaemia a vvt-k alacsony számára vagy hiányos hemoglobintartalmára utal." },
            { cat: 2, q: "Milyen vitamin hiánya okoz vészes vérszegénységet (anaemia perniciosa)?", opts: ["C-vitamin", "B12-vitamin és folsav", "K-vitamin", "D-vitamin"], ans: 1, exp: "A B12-vitamin és folsav hiánya gátolja a DNS-szintézist és a vvt-k érését." },
            { cat: 2, q: "Milyen gyomornedv-összetevő szükséges a B12-vitamin felszívódásához?", opts: ["Sósav", "Intrinsic faktor (IF)", "Pepsin", "Gastrin"], ans: 1, exp: "A parietalissejtek által termelt Intrinsic Faktor köti a B12-vitamint." },
            { cat: 2, q: "Hol zajlik az elöregedett vörösvértestek lebontása?", opts: ["Tüdőben és vesében", "Lép, máj és csontvelő makrofágjaiban", "Nyirokcsomókban", "Vékonybélben"], ans: 1, exp: "Az elöregedett vvt-ket a lép, a máj és a csontvelő makrofágjai kebelezik be." },
            { cat: 2, q: "Mi lesz a hemoglobin globin részéből a lebontás során?", opts: ["Bilirubin", "Aminosavak (újrahasznosulnak)", "Urobilinogen", "Széklettel távozik"], ans: 1, exp: "A globin aminosavakra hidrolizál, amiket a szervezet újra felhasznál." },
            { cat: 2, q: "Milyen szállítófehérje viszi a hemből származó vasat (Fe3+) a vérben?", opts: ["Ferritin", "Transferrin", "Albumin", "Trombomodulin"], ans: 1, exp: "A vasat a vérplazmában a transferrin szállítja." },
            { cat: 2, q: "Hol és milyen formában tárolódik a felesleges vas?", opts: ["Vesében transferrinként", "Májban ferritin formájában", "Lépben bilirubinként", "Csontban urobilinként"], ans: 1, exp: "A vas a májban tárolódik ferritin formájában." },
            { cat: 2, q: "Milyen zöldes, majd sárgás epepigmentté alakul a porfirinváz?", opts: ["Biliverdinből Bilirubin", "Stercobilinből Urobilin", "Globinból Hem", "Ferritinből Transferrin"], ans: 0, exp: "A hem porfirinváza biliverdinné, majd bilirubinná alakul át." },
            { cat: 2, q: "Hova kerül a májból kikerülő konjugált bilirubin?", opts: ["Vizeletbe vesén át", "Epén keresztül a vékonybélbe", "Vissza csontvelőbe", "Tüdőbe kilégzésre"], ans: 1, exp: "A máj a bilirubint az epébe választja ki, így a vékonybélbe jut." },
            { cat: 2, q: "Mi adja a széklet jellegzetes barnás színét?", opts: ["Stercobilin", "Urobilin", "Transferrin", "Bilirubin"], ans: 0, exp: "A bélbaktériumok által átalakított stercobilin adja a széklet színét." },
            { cat: 2, q: "Melyik molekula adja a vizelet sárgás színét?", opts: ["Ferritin", "Biliverdin", "Urobilin", "Fibrin"], ans: 2, exp: "Az urobilinogen felszívódó része a vesén át urobilinként ürül." },
            { cat: 2, q: "Milyen állapotot nevezünk sárgaságnak (icterus)?", opts: ["Magas vasszint", "Bilirubin felszaporodása a vérben és szövetekben", "Alacsony hemoglobin", "Túl sok leukocita"], ans: 1, exp: "A bilirubin felszaporodása a bőrt és a szemfehérjét sárgára színezi." },
            { cat: 2, q: "Mi történik a hemoglobin kötőképességével szén-monoxid (CO) mérgezéskor?", opts: ["CO2-t nem tud kötni", "A CO 200-szor erősebben kötődik a hemhez, mint az O2 (karboxi-hemoglobin)", "Rákkeltővé válik", "Gyors alvadás lép fel"], ans: 1, exp: "A CO rendkívül nagy affinitással kötődik a hemhez, elzorítva az O2-t." },
            { cat: 2, q: "Hogyan nevezzük a 3-értékű vasat (Fe3+) tartalmazó, oxigénkötésre képtelen hemoglobint?", opts: ["Oxi-hemoglobin", "Karbamino-hemoglobin", "Methemoglobin", "Karboxi-hemoglobin"], ans: 2, exp: "A methemoglobinban a vas Fe3+ állapotú, ami képtelen O2 szállítani." },
            { cat: 2, q: "Milyen gázot szállít a karbamino-hemoglobin?", opts: ["Oxigént", "Szén-dioxidot (CO2)", "Szén-monoxidot", "Nitrogént"], ans: 1, exp: "A Hb-hoz kötött CO2 képezi a karbamino-hemoglobint." },
            { cat: 2, q: "Milyen gázzal telített a piros színű oxi-hemoglobin?", opts: ["CO2", "O2", "N2", "CO"], ans: 1, exp: "Az O2-vel telített hemoglobin az oxi-hemoglobin." },
            { cat: 2, q: "Mi a vörösvértestek süllyedési sebességének (We) klinikai jelentősége?", opts: ["Véralvadási zavar jele", "Nem-specifikus gyulladásos jelzőérték (emelkedése gyulladásra utal)", "Vércsoportot határoz meg", "Vesebetegség szűrője"], ans: 1, exp: "A megemelkedett süllyedés gyulladásos vagy daganatos folyamatot jelez." },
            { cat: 2, q: "Milyen hatással van a tengerszinti magaslati tartózkodás a vvt-számra?", opts: ["Csökkenti", "Megemeli (polycytemia)", "Változatlanul hagyja", "Megszünteti"], ans: 1, exp: "A tartós hipoxia fokozza az EPO termelését, emelve a vvt-számot." },
            { cat: 2, q: "Mi a felnőtt szervezet teljes átlagos gastartalma?", opts: ["100 mg", "1 gramm", "3-4 gramm", "10 gramm"], ans: 2, exp: "A szervezet teljes vastartalma kb. 3–4 gramm (zöme a Hb-ban)." },
            { cat: 2, q: "Hogyan reagál a bikonkáv vvt hipertóniás (tömény) oldatba helyezve?", opts: ["Kidurran (hemolízis)", "Vizet veszít és zsugorodik (molykágótt sejt)", "Változatlan marad", "Megduzzad"], ans: 1, exp: "Hipertóniás közegben az ozmózis miatt víz áramlik ki a sejtből, így az zsugorodik." },
            { cat: 2, q: "Mi történik a vvt-vel hipotóniás (híg) oldatban?", opts: ["Vizet vesz fel, megduzzad és kidurran (hemolízis)", "Zsugorodik", "Megkeményedik", "Eritropoetint termel"], ans: 0, exp: "Hipotóniás közegben víz áramlik be a sejtbe, ami hemolízishez (széteséshez) vezet." },

            // 3. Fehérvérsejtek & Gyulladás (35 kérdés)
            { cat: 3, q: "A fehérvérsejtek hány százalékát teszik ki a granulociták?", opts: ["20-30%", "50-70%", "60-80%", "<1%"], ans: 2, exp: "A granulociták a fehérvérsejtek 60–80%-át alkotják." },
            { cat: 3, q: "Melyik a leggyakoribb granulocita típus a vérben (50-70%)?", opts: ["Eozinofil", "Bazofil", "Neutrofil", "Monocita"], ans: 2, exp: "A neutrofil granulocita a legnépesebb fehérvérsejt csoport (50-70%)." },
            { cat: 3, q: "Milyen becenevet adnak a neutrofil granulocitáknak?", opts: ["Makrofágok", "Mikrofágok", "Plazmasejtek", "Hízósejtek"], ans: 1, exp: "A neutrofileket 'mikrofágoknak' is nevezik baktérium-fagocitáló képességük miatt." },
            { cat: 3, q: "Milyen anyagokat tartalmaznak a neutrofil granulociták granulumai?", opts: ["Hisztamin és heparin", "Proteolitikus enzimek, lizozim, oxidánsok", "Perforin és granzim", "EPO és trombopoetin"], ans: 1, exp: "A neutrofil granulumok emésztőenzimeket, lizozimot és oxidánsokat tartalmaznak." },
            { cat: 3, q: "Milyen állapot jele lehet a megemelkedett neutrofilszám?", opts: ["Bakteriális fertőzés, gyulladás, stressz", "Parazita fertőzés", "Allergiás sokk", "Vírusfertőzés"], ans: 0, exp: "Bakteriális fertőzések és akut gyulladások hatására a neutrofilek száma nő." },
            { cat: 3, q: "Melyik granulocita véd a parazita fertőzések ellen?", opts: ["Neutrofil", "Eozinofil", "Bazofil", "NK-sejt"], ans: 1, exp: "Az eozinofil granulociták a paraziták elleni védekezésre specializálódtak." },
            { cat: 3, q: "Milyen enzimet bocsátanak ki az eozinofil granulociták az allergia mérséklésére?", opts: ["Lizozim", "Hisztamináz", "Plazmin", "Kallikrein"], ans: 1, exp: "Az eozinofilek hisztaminázt szabadítanak fel, ami bontja a hisztamint." },
            { cat: 3, q: "Melyik fehérvérsejt aránya kevesebb, mint 1% a perifériás vérben?", opts: ["Neutrofil", "Eozinofil", "Bazofil", "Monocita"], ans: 2, exp: "A bazofil granulocita a legritkább (<1%)." },
            { cat: 3, q: "Melyik szöveti sejtre hasonlítanak a bazofil granulociták?", opts: ["Fibroblasztok", "Hízósejtek (mast cells)", "Makrofágok", "Plazmasejtek"], ans: 1, exp: "A bazofilek a hízósejtekhez hasonlítanak, hisztamint és heparint tartalmaznak." },
            { cat: 3, q: "Milyen hatást fejt ki a hisztamin az erekre?", opts: ["Érszűkület", "Értágulat (vazodilatáció) és áteresztőképőség-növekedés", "Véralvadás beindítása", "Sejtképzés"], ans: 1, exp: "A hisztamin értágulatot vált ki és növeli a kapillárisok permeabilitását." },
            { cat: 3, q: "Milyen természetes véralvadásgátló anyag található a bazofil granulociták granulumában?", opts: ["Trombin", "Heparin", "Fibrinogén", "Histamináz"], ans: 1, exp: "A bazofilek granulumai heparint tartalmaznak." },
            { cat: 3, q: "Mivé alakulnak át a monociták (2-8%) a szövetekben?", opts: ["Bazofil granulocitává", "Szöveti makrofággá", "T-limfocitává", "Vérlemezkévé"], ans: 1, exp: "A monociták a szövetekbe lépve szöveti makrofágokká alakulnak." },
            { cat: 3, q: "Hogyan nevezzük a máj sajátos, fixált makrofágjait?", opts: ["Alveoláris makrofág", "Kupffer-sejt", "Langerhans-sejt", "Microglia"], ans: 1, exp: "A máj rögzült makrofágjai a Kupffer-sejtek." },
            { cat: 3, q: "Hogyan nevezzük a kötőszövetben rögzült makrofágokat?", opts: ["Histiocyta", "Microglia", "Osteoclast", "Kupffer-sejt"], ans: 0, exp: "A kötőszöveti makrofág neve histiocyta." },
            { cat: 3, q: "Hogyan nevezzük a csontszövetben található többmagvú fagocitáló sejteket?", opts: ["Osteoblast", "Osteoclast", "Kupffer-sejt", "Microglia"], ans: 1, exp: "A csontfaló makrofágok az osteoclastok." },
            { cat: 3, q: "Hogyan nevezzük a központi idegrendszer fagocitáló sejtjeit?", opts: ["Microglia", "Astrocyta", "Kupffer-sejt", "Langerhans-sejt"], ans: 0, exp: "Az agy és gerincvelő makrofágjai a microglia sejtek." },
            { cat: 3, q: "Hogyan nevezzük a tüdő léghólyagocskáiban lévő makrofágokat?", opts: ["Alveoláris makrofág (porsejt)", "Kupffer-sejt", "Histiocyta", "Langerhans-sejt"], ans: 0, exp: "A tüdőben lévő makrofágok az alveoláris makrofágok." },
            { cat: 3, q: "Milyen fertőzésnél emelkedik meg a monociták száma?", opts: ["Bakteriális fertőzés", "Vírusos és gombás fertőzések", "Súlyos vérvesztés", "Kalciumhiány"], ans: 1, exp: "A monociták magas száma vírusos vagy gombás fertőzésekre utal." },
            { cat: 3, q: "Mi a kemotaxis jelensége?", opts: ["O2-kötés", "Irányított sejtvándorlás kémiai ingerek felé", "Elhalás", "Ellenanyag-termelés"], ans: 1, exp: "A kemotaxis a fagocitáló sejtek kémiai ingerek irányába történő mozgása." },
            { cat: 3, q: "Hogyan nevezzük azt a folyamatot, mikor a fehérvérsejtek kijutnak az ép érfalon át (diapedesis)?", opts: ["Phagocytosis", "Diapedesis (extravasatio)", "Hemolízis", "Agglutináció"], ans: 1, exp: "A leukociták érfalon való átpréselődése a diapedesis." },
            { cat: 3, q: "Melyik NEM tartozik a gyulladás 4 klasszikus helyi tünete közé?", opts: ["Pír (Rubor)", "Melegség (Calor)", "Duzzanat (Tumor)", "Sápadtság (Pallor)"], ans: 3, exp: "Klasszikus tünetek: Rubor, Calor, Tumor, Dolor. A sápadtság nem az." },
            { cat: 3, q: "Mi a gyulladás 5. felismert tünete (Galenos/Virchow nyomán)?", opts: ["Fájdalom", "Funkciókiesés (Functio laesa)", "Láz", "Hidegrázás"], ans: 1, exp: "Ötödik tünetként a funkciókárosodást (Functio laesa) írták le." },
            { cat: 3, q: "Mi okozza a gyulladásos duzzanatot (tumort)?", opts: ["Vvt-k felhalmozódása", "Kiáramló vérplazma (ödéma)", "Csontvelő túltermelése", "Fibrin lebomlása"], ans: 1, exp: "Az megnövekedett kapilláris-permeabilitás miatt plazma szivárog a szövet közé." },
            { cat: 3, q: "Mi okozza a gyulladásos bőrpírt (rubort) és melegséget (calort)?", opts: ["Érszűkület", "Helyi értágulat és megnövekedett véráramlás (hyperaemia)", "Vérlemezke dugó", "Idegpusztulás"], ans: 1, exp: "A vazodilatáció miatt megnő a vérátáramlás, ami pírt és meleget kelt." },
            { cat: 3, q: "Melyik NEM része a nem-specifikus (veleszületett) immunválasznak?", opts: ["Bőr és csillók", "Gyulladásos mediátorok", "B-sejtek specifikus ellenanyagai", "Neutrofilek fagocitózisa"], ans: 2, exp: "A B-sejtek ellenanyagai a specifikus (adaptív) immunválaszhoz tartoznak." },
            { cat: 3, q: "Milyen gyors a természetes immunválasz?", opts: ["Azonnali", "1 héten belül", "Több hónap", "Csak emlékeztető oltás után"], ans: 0, exp: "A természetes immunválasz azonnal reagál." },
            { cat: 3, q: "Hagy-e memóriát a nem-specifikus immunválasz?", opts: ["Igen", "Nem, lecseng és nincs memória", "Csak vírusnál", "Csak T-sejteknél"], ans: 1, exp: "A nem-specifikus válasz lecsengése után nem hagy maga után memóriát." },
            { cat: 3, q: "Milyen fehérvérsejt alakul át 'fiatal' vagy 'pálcamagvú' (stabs) alakká fertőzéskor?", opts: ["Limfocita", "Neutrofil granulocita", "Monocita", "Eozinofil"], ans: 1, exp: "Fiatal neutrofilek (stab) megjelenése a vérben a 'balra tolt vérkép' jele." },
            { cat: 3, q: "Mit jelent a 'balra tolt' minőségi vérkép?", opts: ["Minden fvs csökken", "Fiatal, nem teljesen érett neutrofil granulociták (stab) megjelenése", "T-sejtek szaporodása", "Vvt-k hiánya"], ans: 1, exp: "Akut fertőzésben a csontvelő éretlen neutrofileket ürít a vérbe." },
            { cat: 3, q: "Miből áll a genny (pus) túlnyomó része?", opts: ["Plazmafehérjékből", "Elhalt neutrofil granulocitákból, kórokozókból és sejttörmelékből", "Vörösvértestekből", "B-limfocitákból"], ans: 1, exp: "A genny a fagocitózis során elhalt neutrofilek és elhalt szövetek tömege." },
            { cat: 3, q: "Melyik fehérvérsejt-típus aránya 20-40% a vérben?", opts: ["Neutrofil", "Limfocita", "Monocita", "Eozinofil"], ans: 1, exp: "A limfociták a második leggyakoribb sejtcsoport (20-40%)." },
            { cat: 3, q: "Mi a leukopenia?", opts: ["Fehérvérsejtszám megemelkedése", "Fehérvérsejtszám kóros lecsökkenése (<5000/µl)", "Vörösvértest hiány", "Trombocita hiány"], ans: 1, exp: "A leukopenia a fehérvérsejtek alacsony számát jelenti." },
            { cat: 3, q: "Mi a leukocytosis?", opts: ["Fehérvérsejtszám élettani vagy kóros megemelkedése (>10 000/µl)", "Vérzékenység", "Sárgaság", "Csonteredetű anaemia"], ans: 0, exp: "A leukocytosis a megemelkedett fehérvérsejtszám." },
            { cat: 3, q: "Milyen anyagnak van központi szerepe a láz (febris) kiváltásában az hipotalamuszban?", opts: ["Prostaglandinok és pirogének (pl. IL-1, TNF-alfa)", "Hisztamin", "Heparin", "Fibrinogén"], ans: 0, exp: "A gyulladásos pirogének prostaglandin E2-t indukálnak az agyban, lázat okozva." },
            { cat: 3, q: "Mi a lizozim enzim szerepe?", opts: ["Véralvadás", "Baktériumok sejtfalának (peptidoglikán) bontása", "Vas-szállítás", "Hisztamin-termelés"], ans: 1, exp: "A lizozim elpusztítja a baktériumok sejtfalát." },

            // 4. Vérlemezkék & Véralvadás (35 kérdés)
            { cat: 4, q: "Melyik sejt szétesésével keletkeznek a trombociták?", opts: ["Erythroblast", "Megakariocita", "Monocita", "Limfoblaszt"], ans: 1, exp: "A trombociták a megakariociták plazmájából lefűződő sejtmagtalan töredékek." },
            { cat: 4, q: "Mennyi a vérlemezkék élettartama?", opts: ["120 nap", "9-11 nap", "<12 óra", "Több év"], ans: 1, exp: "A vérlemezkék élettartama mindössze 9–11 nap." },
            { cat: 4, q: "Van-e sejtmagja a keringő vérlemezkének?", opts: ["Igen, karéjos magja van", "Nincs sejtmagja", "Több sejtmagja is van", "Csak fiatal korában van"], ans: 1, exp: "A trombociták sejtmag nélküli sejttöredékek." },
            { cat: 4, q: "Mi a hemosztázis első lépése sérüléskor?", opts: ["Fibrinolízis", "Helyi érreakció (reflexes vazokonstrikció)", "Vörös trombus", "Plazmin aktiváció"], ans: 1, exp: "Első lépés a reflexes vazokonstrikció (érszűkület)." },
            { cat: 4, q: "Hogyan nevezzük a trombocita-reakció elsődleges alvadékát?", opts: ["Vörös trombus", "Fehér trombus (trombusdugó)", "Fibrinháló", "Plazmin alvadék"], ans: 1, exp: "A vérlemezkék összetapadásával létrejövő dugó a fehér trombus." },
            { cat: 4, q: "Milyen anyagra tapadnak rá a trombociták a sérült érfalban (adhézió)?", opts: ["Endothel sejtekre", "Subendothelialis kollagén rostokra", "Simaizomra", "Fibrinre"], ans: 1, exp: "A sérüléskor kiszabaduló kollagénhez tapadnak a trombociták." },
            { cat: 4, q: "Milyen fehérje közvetíti a trombociták kollagénhez való kötődését?", opts: ["von Willebrand faktor (vWF)", "Fibrinogén", "Albumin", "Trombin"], ans: 0, exp: "A vWF híd szerepet tölt be a kollagén és a trombociták között." },
            { cat: 4, q: "Milyen anyagokat szabadítanak fel az aktivált trombociták?", opts: ["ADP, szerotonin, tromboxán A2", "Hisztamin és heparin", "EPO és bilirubin", "Transferrin és ferritin"], ans: 0, exp: "Az aktivált trombociták ADP-t, szerotonint és tromboxán A2-t bocsátanak ki." },
            { cat: 4, q: "Mi a tromboxán A2 (TXA2) hatása?", opts: ["Értágulat", "Erős érszűkület és trombocita-aggregáció fokozása", "Véralvadásgátlás", "Fibrinolízis"], ans: 1, exp: "A TXA2 szűkíti az ereket és fokozza a vérlemezkék összetapadását." },
            { cat: 4, q: "Milyen gyógyszer gátolja a tromboxán A2 szintézisét (cox-1 gátló) vérrögképződés ellen?", opts: ["Aspirin (acetilszalicilsav)", "Paracetamol", "Heparin", "Vitamin K"], ans: 0, exp: "Az Aspirin kis dózisban gátolja a ciklooxigenázt, csökkentve a TXA2-t." },
            { cat: 4, q: "Hány véralvadási faktor van a kaszkádban?", opts: ["4", "8", "12", "20"], ans: 2, exp: "A véralvadási kaszkádot 12 faktor alkotja." },
            { cat: 4, q: "Melyik ion elengedhetetlen a véralvadáshoz (IV. faktor)?", opts: ["Na+", "K+", "Ca2+", "Fe3+"], ans: 2, exp: "A kalciumionok (Ca2+) jelenléte elengedhetetlen a véralvadáshoz." },
            { cat: 4, q: "Melyik vitamin kell az alvadási faktorok (II, VII, IX, X) szintéziséhez?", opts: ["A-vitamin", "C-vitamin", "D-vitamin", "K-vitamin"], ans: 3, exp: "A K-vitamin elengedhetetlen a májban ezen faktorok szintéziséhez." },
            { cat: 4, q: "Mi indítja be a véralvadás 'külső útját' (extrinsic)?", opts: ["Üvegfelület", "Sérült sejtfelszín / szöveti faktor (TF / III. faktor)", "I. faktor autoaktiváció", "Trombomodulin"], ans: 1, exp: "A külső utat a sérült szövetekből felszabaduló szöveti faktor indítja el." },
            { cat: 4, q: "Mi indítja be a véralvadás 'belső útját' (intrinsic)?", opts: ["Szöveti faktor", "Negatív töltésű felületekkel (kollagén, üveg) való érintkezés (XII. faktor)", "Kalcium hiánya", "Plazmin"], ans: 1, exp: "A belső út a XII. faktor felületi kontaktusával indul." },
            { cat: 4, q: "Melyik enzim alakítja a fibrinogént fibrinné?", opts: ["Plazmin", "Trombin (IIa faktor)", "Kallikrein", "Lizozim"], ans: 1, exp: "A trombin enzim hasítja le a fibrinogént, kialakítva a fibrin szálakat." },
            { cat: 4, q: "Hogyan nevezzük az inaktív előalakot, amiből a trombin keletkezik?", opts: ["Fibrinogén", "Prothrombin (II. faktor)", "Plazminogén", "Kallikrein"], ans: 1, exp: "A prothrombinból a prothrombináz-komplex hatására jön létre a trombin." },

            { cat: 6, q: "Milyen immunglobulin osztályba tartozik az szerzett anti-D ellenanyag?", opts: ["IgM", "IgG", "IgA", "IgE"], ans: 1, exp: "Az anti-D IgG típusú, ezért átjut a placentán." },
            { cat: 6, q: "Mikor veszélyes az Rh-összeférhetetlenség (erythroblastosis foetalis)?", opts: ["Rh+ anya, Rh- magzat", "Rh- anya 1. terhessége", "Rh- anya 2. (vagy többedik) Rh+ magzata", "Rh+ parents"], ans: 2, exp: "Ha az Rh- anya már immunizálódott, az anti-D átjut a 2. Rh+ magzatba." },
            { cat: 6, q: "Hogyan előzhető meg az Rh-immunizáció az anyában szülés után?", opts: ["K-vitaminnal", "Anya passzív immunizálásával anti-D injekcióval 72 órán belül", "Méhen belüli műtéttel", "Ca2+-al"], ans: 1, exp: "A szülés után adott anti-D injekció elpusztítja a bejutott magzati vvt-ket." },
            { cat: 6, q: "Mit jelent a hemagglutináció?", opts: ["Feloldódás", "Vvt-k kicsapódása ellenanyag hatására", "Vérlemezke dugó", "Hb lebomlás"], ans: 1, exp: "A vvt-k specifikus kicsapódása antitestek jelenlétében." },
            { cat: 6, q: "Ha egy vérminta anti-A-val kicsapódik, de anti-B-vel NEM, mi a vércsoport?", opts: ["A vércsoport", "B vércsoport", "AB vércsoport", "0 vércsoport"], ans: 0, exp: "Csak A antigén van jelen, így a vércsoport: A." },
            { cat: 6, q: "Ha egy vérminta sem anti-A-val, sem anti-B-vel NEM csapódik ki, mi a vércsoportja?", opts: ["A", "B", "AB", "0"], ans: 3, exp: "Antigén hiányában egyik sem csapja ki, így a vércsoport: 0." },
            { cat: 6, q: "Ha egy vérminta anti-A és anti-B szérummal IS kicsapódik, mi a vércsoport?", opts: ["A", "B", "AB", "0"], ans: 2, exp: "Mindkét antigén jelen van, így a vércsoport: AB." },
            { cat: 6, q: "Mi a major keresztreakció próba lényege transzfúzió előtt?", opts: ["Donor savó + recipiens sejt", "Recipiens savó (plazma) + Donor vörösvértest összeöntése", "Vérnyomás mérés", "Hőmérséklet teszt"], ans: 1, exp: "A kapó plazmáját összekeverik az adó vvt-ivel a kicsapódás kizárására." },
            { cat: 6, q: "Milyen genotípusú lehet egy 'A' vércsoportú személy?", opts: ["Kizárólag AA", "AA vagy A0", "Kizárólag A0", "00"], ans: 1, exp: "Az 'A' vércsoport lehet homozigóta (AA) vagy heterozigóta (A0)." }
        ];

        let database = rawDatabase;
        let currentMode = "all";
        let activeQuestions = [];
        let userAnswers = [];
        let zhSubmitted = false;
        let correctCount = 0;

        function handleModeChange() {
            const val = document.getElementById("categoryFilter").value;
            currentMode = val;
            zhSubmitted = false;
            document.getElementById("submitZhContainer").style.display = "none";
            
            if (val === "all") {
                activeQuestions = database.map((q, idx) => ({ qObj: q, originalIndex: idx }));
            } else {
                activeQuestions = database
                    .map((q, idx) => ({ qObj: q, originalIndex: idx }))
                    .filter(item => item.qObj.cat == val);
            }
            
            userAnswers = new Array(activeQuestions.length).fill(null);
            correctCount = 0;
            updateScore();
            renderQuestions();
        }

        function startZhMode() {
            currentMode = "zh";
            zhSubmitted = false;
            document.getElementById("categoryFilter").value = "all";
            document.getElementById("submitZhContainer").style.display = "block";

            let shuffled = database
                .map((q, idx) => ({ qObj: q, originalIndex: idx }))
                .sort(() => 0.5 - Math.random());
            
            activeQuestions = shuffled.slice(0, 10);
            userAnswers = new Array(10).fill(null);
            correctCount = 0;
            
            updateScore();
            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById("questionsContainer");
            container.innerHTML = "";

            const isZh = (currentMode === "zh");

            if (isZh) {
                const zhGroup = document.createElement("div");
                zhGroup.className = "category-group";
                
                const titleDiv = document.createElement("div");
                titleDiv.className = "category-title";
                titleDiv.innerText = "⚡ ZH MÓD (10 véletlenszerű kérdés a 200-ból) - Jelöld meg a válaszokat, majd kattints a beküldésre!";
                zhGroup.appendChild(titleDiv);

                activeQuestions.forEach((item, qIdx) => {
                    const card = createCard(item.qObj, qIdx, item.originalIndex, true);
                    zhGroup.appendChild(card);
                });

                container.appendChild(zhGroup);
            } else {
                const categories = {
                    1: "1. Vízterek és a vér összetétele",
                    2: "2. Vörösvértestek & Hemoglobin",
                    3: "3. Fehérvérsejtek & Gyulladás",
                    4: "4. Vérlemezkék & Véralvadás",
                    5: "5. Immunológiai alapok & Limfociták",
                    6: "6. Vércsoportok (ABO, Rh)"
                };

                const catGroup = {};
                activeQuestions.forEach((item) => {
                    if (!catGroup[item.qObj.cat]) catGroup[item.qObj.cat] = [];
                    catGroup[item.qObj.cat].push(item);
                });

                for (let catId in catGroup) {
                    const groupDiv = document.createElement("div");
                    groupDiv.className = "category-group";

                    const titleDiv = document.createElement("div");
                    titleDiv.className = "category-title";
                    titleDiv.innerText = categories[catId];
                    groupDiv.appendChild(titleDiv);

                    catGroup[catId].forEach((item) => {
                        const activeIndex = activeQuestions.indexOf(item);
                        const card = createCard(item.qObj, activeIndex, item.originalIndex, false);
                        groupDiv.appendChild(card);
                    });

                    container.appendChild(groupDiv);
                }
            }
        }

        function createCard(qObj, activeIdx, originalIndex, isZh) {
            const card = document.createElement("div");
            card.className = "q-card";

            const header = document.createElement("div");
            header.className = "q-header";
            
            const numText = isZh ? `ZH / ${activeIdx + 1}. Kérdés` : `#${originalIndex + 1}`;
            header.innerHTML = `<span class="q-number">${numText}</span><span class="q-text">${qObj.q}</span>`;
            card.appendChild(header);

            const optionsDiv = document.createElement("div");
            optionsDiv.className = "options";

            const expDiv = document.createElement("div");
            expDiv.className = "explanation";
            expDiv.id = `exp-${activeIdx}`;
            expDiv.innerText = `Magyarázat: ${qObj.exp}`;

            qObj.opts.forEach((optText, optIdx) => {
                const btn = document.createElement("button");
                btn.className = "opt-btn";
                btn.innerText = `${String.fromCharCode(65 + optIdx)}) ${optText}`;

                if (isZh) {
                    if (!zhSubmitted) {
                        if (userAnswers[activeIdx] === optIdx) {
                            btn.classList.add("selected");
                        }
                        btn.onclick = () => {
                            userAnswers[activeIdx] = optIdx;
                            renderQuestions();
                            updateScore();
                        };
                    } else {
                        btn.classList.add("disabled");
                        if (optIdx === qObj.ans) {
                            btn.classList.add("correct");
                        }
                        if (userAnswers[activeIdx] === optIdx && optIdx !== qObj.ans) {
                            btn.classList.add("incorrect");
                        }
                    }
                } else {
                    btn.onclick = () => selectOptionNormal(activeIdx, optIdx);

                    if (userAnswers[activeIdx] !== null) {
                        btn.classList.add("disabled");
                        if (optIdx === qObj.ans) {
                            btn.classList.add("correct");
                        }
                        if (userAnswers[activeIdx] === optIdx && optIdx !== qObj.ans) {
                            btn.classList.add("incorrect");
                        }
                    }
                }

                optionsDiv.appendChild(btn);
            });

            card.appendChild(optionsDiv);
            card.appendChild(expDiv);

            if ((!isZh && userAnswers[activeIdx] !== null) || (isZh && zhSubmitted)) {
                expDiv.style.display = "block";
            }

            return card;
        }

        function selectOptionNormal(activeIdx, optIdx) {
            if (userAnswers[activeIdx] !== null) return;

            userAnswers[activeIdx] = optIdx;
            if (optIdx === activeQuestions[activeIdx].qObj.ans) {
                correctCount++;
            }

            updateScore();
            renderQuestions();
        }

        function submitZh() {
            if (zhSubmitted) return;
            zhSubmitted = true;
            
            correctCount = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === activeQuestions[idx].qObj.ans) {
                    correctCount++;
                }
            });

            updateScore();
            renderQuestions();
            alert(`ZH Befejezve!\nEredményed: ${correctCount} / 10 pont (${(correctCount/10)*100}%)`);
        }

        function updateScore() {
            const answered = userAnswers.filter(a => a !== null).length;
            const total = activeQuestions.length;
            
            if (currentMode === "zh") {
                if (zhSubmitted) {
                    document.getElementById("scoreBoard").innerText = `ZH Eredmény: ${correctCount} / 10 (${(correctCount/10)*100}%)`;
                } else {
                    document.getElementById("scoreBoard").innerText = `ZH Folyamatban: ${answered} / 10 megválaszolva`;
                }
            } else {
                document.getElementById("scoreBoard").innerText = `Kitöltve: ${answered} / ${total} | Helyes: ${correctCount}`;
            }
        }

        handleModeChange();
    </script>
</body>
</html>
